name: Thin media budget regression

on:
  push:
    branches: ['ci/thin-media-budget-v2']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QWEN_MM_RUN_REACHABILITY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Install offline CI dependencies
        run: |
          uv pip install -e . pytest 'numpy<3' 'zvec>=0.8,<1' scipy matplotlib opencv-python-headless 'nibabel>=5,<6' requests 'msgpack>=1.1,<2' pyyaml
      - name: Focused image and real FFmpeg regression
        run: .venv/bin/python -m pytest -q tests/test_shared_image.py
      - name: Project offline tests
        run: .venv/bin/python -m pytest -q -m 'not reachability' tests/
      - name: Manifest consistency
        run: .venv/bin/python scripts/check_manifests.py
  lint-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Check changed Python files
        run: |
          uvx ruff@0.16.9 format --check src/shared/image.py tests/test_shared_image.py
          uvx ruff@0.16.9 check src/shared/image.py tests/test_shared_image.py
      - name: Compare repository checks with upstream base
        run: |
          uvx ruff@0.16.9 format --diff . > "$RUNNER_TEMP/head-format.txt" 2>&1 || true
          uvx ruff@0.16.9 check --output-format=json . > "$RUNNER_TEMP/head-lint.json" || true
          git checkout --detach acad0c92c33b3c76f4904a179279590e805548b7
          uvx ruff@0.16.9 format --diff . > "$RUNNER_TEMP/base-format.txt" 2>&1 || true
          uvx ruff@0.16.9 check --output-format=json . > "$RUNNER_TEMP/base-lint.json" || true
          diff -u "$RUNNER_TEMP/base-format.txt" "$RUNNER_TEMP/head-format.txt"
          diff -u "$RUNNER_TEMP/base-lint.json" "$RUNNER_TEMP/head-lint.json"
          echo 'Repository-wide Ruff results match the upstream base.'
