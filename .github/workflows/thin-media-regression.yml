name: Thin media budget regression

on:
  push:
    branches: ['ci/thin-media-budget']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QWEN_MM_RUN_REACHABILITY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Install offline CI dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e . pytest 'numpy<3' 'zvec>=0.8,<1' scipy matplotlib opencv-python-headless 'nibabel>=5,<6' requests 'msgpack>=1.1,<2' pyyaml
      - name: Focused image and real FFmpeg regression
        run: .venv/bin/python -m pytest -q tests/test_shared_image.py
      - name: Project offline tests
        run: .venv/bin/python -m pytest -q -m 'not reachability' tests/
      - name: Manifest consistency
        run: .venv/bin/python scripts/check_manifests.py
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uvx ruff@0.16.9 format --check .
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uvx ruff@0.16.9 check .
